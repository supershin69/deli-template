<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Deli - Shop History</title>
    <link rel="stylesheet" href="../css/global.css" />
    <link rel="stylesheet" href="../css/components.css" />
    <link rel="stylesheet" href="../css/screens.css" />
  <script src="../js/sidebar.js" defer></script><script src="../js/history-controls.js" defer></script></head>
  <body class="app-bg history-screen">
    <header class="top-app-bar">
      <div class="bar-logo">DELI</div>
      <div class="bar-right">
        <span class="user-role">Shop · ABC Store</span
        ><button class="hamburger-icon-btn" type="button">☰</button>
      </div>
    </header>
    <main class="workspace-body">
      <span class="section-tag">ABC STORE</span>
      <h1 class="main-heading">Order history</h1>
      <p class="page-intro">All orders made by your shop.</p>
      <section class="ui-card-white history-filter-card">
        <h2>Find an order</h2>
        <div class="history-form-grid">
          <div class="input-field-group full-field">
            <label>SEARCH</label
            ><input
              id="historySearch"
              type="search"
              placeholder="Search order, customer, address..."
            />
          </div>
          <div class="input-field-group">
            <label>STATUS</label
            ><select>
              <option>All statuses</option>
              <option>Pending</option>
              <option>On way</option>
              <option>Delivered</option>
              <option>Failed</option>
            </select>
          </div>
          <div class="input-field-group">
            <label>DATE</label>
            <div class="custom-date-picker">
              <input id="historyDate" type="date" /><button
                class="custom-date-trigger"
                type="button"
              >
                dd/mm/yy
              </button>
              <div class="custom-calendar"></div>
            </div>
          </div>
        </div>
        <button
          class="ui-btn btn-navy-blue history-save"
          id="saveFilter"
          type="button"
        >
          Search
        </button>
      </section>
      <div class="badge-group history-badges">
        <span class="ui-badge badge-navy">24-08-2026</span
        ><span class="ui-badge badge-lime" id="resultCount">3 orders</span>
      </div>
      <section class="ui-card-white history-list-card">
        <div class="history-card-heading">
          <div>
            <span class="section-tag">ORDERS</span>
            <h2>All orders</h2>
          </div>
        </div>
        <div class="history-table-wrap">
          <table class="workspace-table history-table">
            <thead>
              <tr>
                <th>NO.</th>
                <th>CUSTOMER</th>
                <th>DATE</th>
                <th>STATUS</th>
                <th>ACTION</th>
              </tr>
            </thead>
            <tbody id="historyRows">
              <tr>
                <td>01</td>
                <td>Cho Aung Tin</td>
                <td>24-08-2026</td>
                <td>Pending</td>
                <td>
                  <a
                    class="table-action"
                    href="./history-detail.html?order=91axcn"
                    >View</a
                  >
                </td>
              </tr>
              <tr>
                <td>02</td>
                <td>Nyi Nyi Thant</td>
                <td>23-08-2026</td>
                <td>On way</td>
                <td>
                  <a
                    class="table-action"
                    href="./history-detail.html?order=ovzbgx"
                    >View</a
                  >
                </td>
              </tr>
              <tr>
                <td>03</td>
                <td>Aye Aye</td>
                <td>21-08-2026</td>
                <td>Delivered</td>
                <td>
                  <a
                    class="table-action"
                    href="./history-detail.html?order=ayeaye"
                    >View</a
                  >
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </section>
    </main>
    <script>
      document.getElementById("historySearch").oninput = (e) => {
        const q = e.target.value.toLowerCase();
        document
          .querySelectorAll("#historyRows tr")
          .forEach(
            (row) => (row.hidden = !row.textContent.toLowerCase().includes(q)),
          );
        document.getElementById("resultCount").textContent =
          [...document.querySelectorAll("#historyRows tr")].filter(
            (row) => !row.hidden,
          ).length + " orders";
      };
      document
        .querySelectorAll(".history-filter-card select")
        .forEach((select) => {
          const wrapper = document.createElement("div");
          wrapper.className = "custom-select";
          select.parentNode.insertBefore(wrapper, select);
          wrapper.appendChild(select);
          const toggle = document.createElement("button");
          toggle.type = "button";
          toggle.className = "custom-select-toggle";
          toggle.textContent = select.options[0].text;
          wrapper.appendChild(toggle);
          const options = document.createElement("ul");
          options.className = "custom-select-options";
          [...select.options].forEach((option, i) => {
            const item = document.createElement("li");
            item.className = "custom-select-option";
            item.textContent = option.text;
            item.onclick = () => {
              select.selectedIndex = i;
              toggle.textContent = option.text;
              wrapper.classList.remove("open");
            };
            options.appendChild(item);
          });
          wrapper.appendChild(options);
          toggle.onclick = () => wrapper.classList.toggle("open");
        });
      const dateInput = document.getElementById("historyDate"),
        datePicker = document.querySelector(".custom-date-picker"),
        trigger = datePicker.querySelector(".custom-date-trigger"),
        calendar = datePicker.querySelector(".custom-calendar");
      let viewDate = new Date();
      const pad = (n) => String(n).padStart(2, "0");
      function draw() {
        const y = viewDate.getFullYear(),
          m = viewDate.getMonth(),
          first = new Date(y, m, 1).getDay(),
          days = new Date(y, m + 1, 0).getDate();
        calendar.innerHTML =
          '<div class="calendar-head"><button type="button" data-step="-1">‹</button><span>' +
          viewDate.toLocaleString("en", { month: "long", year: "numeric" }) +
          '</span><button type="button" data-step="1">›</button></div><div class="calendar-grid"><span>Su</span><span>Mo</span><span>Tu</span><span>We</span><span>Th</span><span>Fr</span><span>Sa</span></div><div class="calendar-grid" id="days"></div>';
        const grid = document.getElementById("days");
        for (let i = 0; i < first; i++)
          grid.append(document.createElement("button"));
        for (let d = 1; d <= days; d++) {
          const b = document.createElement("button");
          b.type = "button";
          b.textContent = d;
          b.onclick = () => {
            dateInput.value = y + "-" + pad(m + 1) + "-" + pad(d);
            trigger.textContent =
              pad(d) + "/" + pad(m + 1) + "/" + String(y).slice(-2);
            datePicker.classList.remove("open");
          };
          grid.append(b);
        }
      }
      trigger.onclick = () => {
        datePicker.classList.toggle("open");
        draw();
      };
      calendar.onclick = (e) => {
        if (e.target.dataset.step) {
          viewDate.setMonth(
            viewDate.getMonth() + Number(e.target.dataset.step),
          );
          draw();
        }
      };
      document.addEventListener("click", (e) => {
        if (!e.target.closest(".custom-select"))
          document
            .querySelectorAll(".custom-select.open")
            .forEach((x) => x.classList.remove("open"));
        if (!datePicker.contains(e.target)) datePicker.classList.remove("open");
      });
      draw();
      const nav = document.createElement("div");
      nav.className = "slide-sidebar";
      nav.innerHTML =
        '<a class="sidebar-row" href="./orders.html"><strong>Orders</strong><span>Active orders</span></a><a class="sidebar-row active-row" href="./history.html"><strong>History</strong><span>All orders</span></a>';
      const overlay = document.createElement("div");
      overlay.className = "sidebar-overlay";
      document.body.append(nav, overlay);
      document.querySelector(".hamburger-icon-btn").onclick = () => {
        nav.classList.add("open");
        overlay.classList.add("visible");
      };
      overlay.onclick = () => {
        nav.classList.remove("open");
        overlay.classList.remove("visible");
      };
    </script>
  </body>
</html>
